name: sports_app
description: "KRICO - Krida & Coach Sports Ecosystem Platform - Pune Pilot"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.0.4
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.0.0
  uuid: ^4.5.1
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/sports/
    - assets/images/dashboard/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
    - assets/avatars/
    - assets/backgrounds/
    - assets/logos/
    - assets/empty/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#090A0F"
  adaptive_icon_foreground: "assets/logos/ic_launcher_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logos/app_icon.png"
    background_color: "#090A0F"
    theme_color: "#CCFF00"
