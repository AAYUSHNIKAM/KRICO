name: sports_app
description: "Sports Ecosystem Platform - Pune Pilot"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.0.4
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.0.0
  uuid: ^4.5.1
  device_preview: ^1.2.0
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_svg: ^2.0.17
  timeline_tile: ^2.0.0
  lottie: ^3.3.1
  badges: ^3.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
