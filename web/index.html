<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KRICO - Next-Gen Sports Ecosystem and Athlete Progression Platform">

  <!-- Mobile Viewport & iOS Apple Smartphone Support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KRICO">
  <meta name="theme-color" content="#090B10">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KRICO Sports Ecosystem</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #090B10;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
     justify-content: center;
      width: 100%;
      height: 100%;
      background-color: #090B10;
      color: #CCFF00;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(204, 255, 0, 0.2);
      border-top-color: #CCFF00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="margin-top: 16px; font-weight: 800; letter-spacing: 2px; font-size: 13px;">KRICO SPORTS</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
